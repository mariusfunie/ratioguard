services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ratioguard-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ratioguard_data:/data
    networks:
      - ratioguard-net

  frontend:
    image: nginx:alpine
    container_name: ratioguard-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ratioguard-net

  nginx:
    image: nginx:alpine
    container_name: ratioguard-nginx
    restart: unless-stopped
    ports:
      - "7990:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ratioguard-net

volumes:
  ratioguard_data:

networks:
  ratioguard-net:
    driver: bridge
